server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 20m;

    # The built React app's static files live alongside Laravel's public/
    # (see Dockerfile) so this whole app is served from one origin, same as
    # Vite's dev-server proxy does locally — no cross-origin cookie/CORS
    # complexity for Sanctum's SPA auth in production.

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Everything else is the SPA — client-side routing (React Router) owns
    # any path that isn't a real static file, so fall back to index.html
    # rather than Laravel's index.php.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
